<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none" role="img" aria-label="花伤情犹在 - AI Development Engineer · AI 开发工程师">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D1C"/>
      <stop offset="55%" stop-color="#131A36"/>
      <stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="75%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;0.5;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0%" stop-color="#6366F1" stop-opacity=".55"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".4"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0%" stop-color="#D946EF" stop-opacity=".35"/><stop offset="100%" stop-color="#D946EF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#93C5FD" opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
      .cn{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <ellipse cx="120" cy="40" rx="240" ry="170" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 34 22; -12 10; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="270" rx="260" ry="180" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 -20; 14 -8; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="10" rx="210" ry="130" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 26; 22 6; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ══════ 神经网络背景 ══════ -->
    <g opacity=".55">
      <g stroke="#818CF8" stroke-opacity=".16" stroke-width="1">
        <path id="n1" d="M420 60 L500 110 L590 70"/>
        <path id="n2" d="M420 60 L470 200 L590 70"/>
        <path id="n3" d="M500 110 L470 200 L560 250"/>
        <path id="n4" d="M500 110 L560 250"/>
        <path d="M420 60 L500 110"/><path d="M470 200 L420 250"/>
      </g>
      <g fill="#A5B4FC">
        <circle cx="420" cy="60" r="3"><animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="500" cy="110" r="3"><animate attributeName="r" values="2;4;2" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
        <circle cx="590" cy="70" r="2.5"/>
        <circle cx="470" cy="200" r="3"><animate attributeName="r" values="2;4;2" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
        <circle cx="560" cy="250" r="2.5"/>
        <circle cx="420" cy="250" r="2"/>
      </g>
      <g fill="#22D3EE" filter="url(#glow)">
        <circle r="2.4"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#n1"/></animateMotion></circle>
        <circle r="2.4"><animateMotion dur="4.2s" begin="-1.3s" repeatCount="indefinite"><mpath href="#n2"/></animateMotion></circle>
        <circle r="2.4" fill="#E879F9"><animateMotion dur="3.8s" begin="-.6s" repeatCount="indefinite"><mpath href="#n3"/></animateMotion></circle>
        <circle r="2" fill="#E879F9"><animateMotion dur="2.6s" begin="-2s" repeatCount="indefinite"><mpath href="#n4"/></animateMotion></circle>
      </g>
    </g>

    <!-- ══════ 左侧文字 ══════ -->
    <g transform="translate(56, 78)">
      <rect x="0" y="-15" width="244" height="26" rx="13" fill="#A855F7" fill-opacity=".14" stroke="#C084FC" stroke-opacity=".45"/>
      <circle cx="16" cy="-2" r="4" fill="#4ADE80"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="28" y="2" class="mono" font-size="11.5" letter-spacing="1.8" fill="#E9D5FF">AI DEVELOPMENT ENGINEER</text>

      <text x="0" y="76" class="cn" font-size="56" font-weight="700" letter-spacing="2" fill="url(#nameGrad)">花伤情犹在</text>

      <rect x="0" y="92" width="0" height="3" rx="1.5" fill="url(#lineGrad)">
        <animate attributeName="width" from="0" to="310" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>

      <text x="0" y="126" class="cn" font-size="16" fill="#94A3B8">AI 开发工程师 · 让大模型和 Agent 替我写代码</text>

      <g class="mono" font-size="11.5" fill="#CBD5E1">
        <g opacity="0"><rect x="0" y="144" width="68" height="24" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="13" y="160">Agent</text>
          <animate attributeName="opacity" from="0" to="1" begin=".5s" dur=".5s" fill="freeze"/></g>
        <g opacity="0"><rect x="76" y="144" width="52" height="24" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="89" y="160">LLM</text>
          <animate attributeName="opacity" from="0" to="1" begin=".65s" dur=".5s" fill="freeze"/></g>
        <g opacity="0"><rect x="136" y="144" width="52" height="24" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="149" y="160">MCP</text>
          <animate attributeName="opacity" from="0" to="1" begin=".8s" dur=".5s" fill="freeze"/></g>
        <g opacity="0"><rect x="196" y="144" width="52" height="24" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="209" y="160">RAG</text>
          <animate attributeName="opacity" from="0" to="1" begin=".95s" dur=".5s" fill="freeze"/></g>
        <g opacity="0"><rect x="256" y="144" width="68" height="24" rx="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="269" y="160">Skill</text>
          <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur=".5s" fill="freeze"/></g>
      </g>
    </g>

    <!-- ══════ 右侧终端：Agent 舰队 ══════ -->
    <g transform="translate(608, 46)">
      <rect width="352" height="208" rx="12" fill="#0B1022" fill-opacity=".88" stroke="#fff" stroke-opacity=".10"/>
      <rect width="352" height="34" rx="12" fill="#fff" fill-opacity=".04"/>
      <rect y="26" width="352" height="8" fill="#fff" fill-opacity=".04"/>
      <circle cx="18" cy="17" r="4.5" fill="#FF5F57"/><circle cx="34" cy="17" r="4.5" fill="#FEBC2E"/><circle cx="50" cy="17" r="4.5" fill="#28C840"/>
      <text x="176" y="21" text-anchor="middle" class="mono" font-size="10.5" fill="#64748B">~/ship-it — agents</text>

      <g class="mono" font-size="12">
        <text x="18" y="60" opacity="0"><tspan fill="#4ADE80">❯ </tspan><tspan fill="#E2E8F0">fleet run </tspan><tspan fill="#FBBF24">"build the feature"</tspan>
          <animate attributeName="opacity" from="0" to="1" begin=".3s" dur=".3s" fill="freeze"/></text>

        <text x="18" y="88" opacity="0"><tspan fill="#D97757">◆ claude</tspan><tspan x="112" fill="#64748B">plan</tspan><tspan x="172" fill="#4ADE80">✓ done</tspan>
          <animate attributeName="opacity" from="0" to="1" begin=".9s" dur=".3s" fill="freeze"/></text>
        <text x="18" y="110" opacity="0"><tspan fill="#E2E8F0">◆ codex</tspan><tspan x="112" fill="#64748B">code</tspan><tspan x="172" fill="#4ADE80">✓ done</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur=".3s" fill="freeze"/></text>
        <text x="18" y="132" opacity="0"><tspan fill="#60A5FA">◆ gemini</tspan><tspan x="112" fill="#64748B">review</tspan><tspan x="172" fill="#4ADE80">✓ done</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur=".3s" fill="freeze"/></text>
        <text x="18" y="154" opacity="0"><tspan fill="#4D6BFE">◆ deepseek</tspan><tspan x="112" fill="#64748B">test</tspan><tspan x="172" fill="#4ADE80">✓ done</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur=".3s" fill="freeze"/></text>
        <text x="18" y="176" opacity="0"><tspan fill="#E2E8F0">◆ grok</tspan><tspan x="112" fill="#64748B">ship</tspan><tspan x="172" fill="#22D3EE">● running</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur=".3s" fill="freeze"/></text>

        <text x="18" y="198" opacity="0" fill="#94A3B8">❯ <tspan fill="#C084FC">human</tspan>: ☕ 喝咖啡中…
          <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur=".3s" fill="freeze"/></text>
        <rect x="196" y="188" width="7" height="13" fill="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="0;1;0;1;0" dur="2s" begin="3.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="0" y="296" width="1000" height="4" fill="url(#lineGrad)">
      <animate attributeName="x" values="-1000;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1000" height="300" rx="18" fill="none" stroke="#fff" stroke-opacity=".08"/>
  </g>
</svg>
