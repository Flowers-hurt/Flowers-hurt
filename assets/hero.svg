<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" fill="none" role="img" aria-label="花伤情犹在 - Java Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#141B34"/>
      <stop offset="100%" stop-color="#0D1428"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;0.4;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.4;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#93C5FD" opacity="0.07"/>
    </pattern>

    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- 呼吸光晕 -->
    <ellipse cx="120" cy="40" rx="230" ry="170" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 34 22; -12 10; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="250" rx="250" ry="180" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -30 -20; 14 -8; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="10" rx="200" ry="130" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -18 26; 22 6; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ══════ 左侧文字 ══════ -->
    <g transform="translate(56, 74)">
      <!-- 顶部标签 -->
      <rect x="0" y="-14" width="196" height="24" rx="12" fill="#6366F1" fill-opacity="0.14" stroke="#6366F1" stroke-opacity="0.35"/>
      <text x="14" y="3" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11.5"
            letter-spacing="1.6" fill="#A5B4FC">&#60;/&#62; BACKEND ENGINEER</text>

      <!-- 主标题 -->
      <text x="0" y="72" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
            font-size="54" font-weight="700" letter-spacing="2" fill="url(#nameGrad)">花伤情犹在</text>

      <!-- 渐变下划线 -->
      <rect x="0" y="88" width="0" height="3" rx="1.5" fill="url(#lineGrad)">
        <animate attributeName="width" from="0" to="300" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>

      <!-- 副标题 -->
      <text x="0" y="122" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15.5" fill="#94A3B8">
        Java 后端工程师 &#183; 热爱技术，也热爱生活
      </text>

      <!-- 技能药丸 -->
      <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11.5" fill="#CBD5E1">
        <g opacity="0">
          <rect x="0" y="140" width="62" height="24" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="14" y="156">Java</text>
          <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
        </g>
        <g opacity="0">
          <rect x="70" y="140" width="82" height="24" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="84" y="156">Spring</text>
          <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.5s" fill="freeze"/>
        </g>
        <g opacity="0">
          <rect x="160" y="140" width="74" height="24" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="174" y="156">MySQL</text>
          <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
        </g>
        <g opacity="0">
          <rect x="242" y="140" width="70" height="24" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
          <text x="256" y="156">Redis</text>
          <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.5s" fill="freeze"/>
        </g>
      </g>
    </g>

    <!-- ══════ 右侧终端卡片 ══════ -->
    <g transform="translate(604, 52)">
      <rect x="0" y="0" width="352" height="180" rx="12" fill="#0F172A" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="0" y="0" width="352" height="34" rx="12" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="0" y="26" width="352" height="8" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="18" cy="17" r="4.5" fill="#FF5F57"/>
      <circle cx="34" cy="17" r="4.5" fill="#FEBC2E"/>
      <circle cx="50" cy="17" r="4.5" fill="#28C840"/>
      <text x="140" y="21" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#64748B">Profile.java</text>

      <g font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12">
        <text x="20" y="62" fill="#C084FC">@Component<animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/></text>

        <text x="20" y="84" opacity="0">
          <tspan fill="#F472B6">public class </tspan><tspan fill="#7DD3FC">Profile</tspan><tspan fill="#94A3B8"> {</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
        </text>

        <text x="34" y="108" opacity="0">
          <tspan fill="#94A3B8">focus  = </tspan><tspan fill="#86EFAC">"Spring Cloud"</tspan><tspan fill="#94A3B8">;</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
        </text>

        <text x="34" y="130" opacity="0">
          <tspan fill="#94A3B8">coffee = </tspan><tspan fill="#FBBF24">Integer.MAX_VALUE</tspan><tspan fill="#94A3B8">;</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/>
        </text>

        <text x="20" y="154" opacity="0">
          <tspan fill="#94A3B8">}</tspan>
          <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
        </text>

        <!-- 光标 -->
        <rect x="30" y="144" width="7" height="14" fill="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" dur="4s" begin="1.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- 底部流光 -->
    <rect x="0" y="276" width="1000" height="4" fill="url(#lineGrad)">
      <animate attributeName="x" values="-1000;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1000" height="280" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>