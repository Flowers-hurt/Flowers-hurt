<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" fill="none" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="7" width="1000" height="2" rx="1" fill="url(#d)"/>

  <!-- 扫光 -->
  <rect y="7" width="180" height="2" rx="1" fill="url(#glow)" opacity="0.7">
    <animate attributeName="x" values="-180;1000" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- 中心菱形 -->
  <g transform="translate(500 8)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" transform="rotate(45)" fill="#0D1117" stroke="#A855F7" stroke-width="1.4"/>
    <circle r="1.8" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>