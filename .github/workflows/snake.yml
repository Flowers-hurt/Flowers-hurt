# 放置路径：.github/workflows/snake.yml
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 自动更新
  workflow_dispatch:      # 支持手动触发
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Flowers-hurt
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#6366F1&color_dots=#161b22,#312E81,#4F46E5,#6366F1,#22D3EE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}